    <!-- PWA Install Prompt Listener -->
    <script>
        let deferredPrompt;
        const installButton = document.getElementById('installButton');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installButton) {
                installButton.style.display = 'inline-flex';
            }
            console.log('beforeinstallprompt event fired. Install button is now visible.');
        });

        if (installButton) {
            installButton.addEventListener('click', () => {
                if (deferredPrompt) {
                    installButton.style.display = 'none';
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('User accepted the A2HS prompt');
                        } else {
                            console.log('User dismissed the A2HS prompt');
                        }
                        deferredPrompt = null;
                    });
                }
            });
        }

        window.addEventListener('appinstalled', (e) => {
            console.log('PWA was successfully installed.');
            if (installButton) {
                installButton.style.display = 'none';
            }
        });
    </script>

    <!-- Main Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM 元素 ---
            const fromStationInput = document.getElementById('fromStation');
            const toStationInput = document.getElementById('toStation');
            const swapStationsBtn = document.getElementById('swapStations');
            const searchDateInput = document.getElementById('searchDate');
            const searchTimeInput = document.getElementById('searchTime');
            const searchBtn = document.getElementById('searchBtn');
            const showAllTrainsCheckbox = document.getElementById('showAllTrains');
            const stationList = document.getElementById('stationList');
            const resultsContainer = document.getElementById('results');
            const messageDiv = document.getElementById('message');

            // 輔助引用（防禦性命名，避免舊版參照失誤）
            const fromStationSelect = fromStationInput;
            const toStationSelect = toStationInput;

            // 快捷按鈕事件
            const quickTodayBtn = document.getElementById('quickTodayBtn');
            if (quickTodayBtn) {
                quickTodayBtn.addEventListener('click', () => {
                    searchDateInput.value = new Date().toISOString().split('T')[0];
                });
            }
            const quickNowBtn = document.getElementById('quickNowBtn');
            if (quickNowBtn) {
                quickNowBtn.addEventListener('click', () => {
                    const now = new Date();
                    searchTimeInput.value = now.toTimeString().split(' ')[0].substring(0, 5);
                });
            }

            // 常用站點按鈕點擊支援
            document.querySelectorAll('.quick-station-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const stName = chip.getAttribute('data-station');
                    if (!fromStationInput.value) {
                        fromStationInput.value = stName;
                    } else if (!toStationInput.value || toStationInput.value === fromStationInput.value) {
                        toStationInput.value = stName;
                    } else {
                        toStationInput.value = stName;
                    }
                    // performSearch();
                });
            });

            // --- 車次完整路線快取 ---
            const globalRouteCache = {};

                stations.forEach(station => {

                        aliasOption.value = station.name.replace(/臺/g, '台');
                        stationList.appendChild(aliasOption);
                    }
                });

                const now = new Date();
                fromStationInput.value = '竹北';
                toStationInput.value = '板橋';
                searchDateInput.value = now.toISOString().split('T')[0];
                searchTimeInput.value = now.toTimeString().split(' ')[0].substring(0, 5);
                showAllTrainsCheckbox.checked = false;

                // 進入頁面後自動執行查詢，展示現代化卡片與動態效果
                // performSearch();
            }

            // --- 事件監聽 ---
            searchBtn.addEventListener('click', performSearch);
            swapStationsBtn.addEventListener('click', () => {
                [fromStationInput.value, toStationInput.value] = [toStationInput.value, fromStationInput.value];
            });
            showAllTrainsCheckbox.addEventListener('change', performSearch);

            // --- 主要功能函式 ---
            async function performSearch() {
                resultsContainer.innerHTML = '';
                messageDiv.innerHTML = `
                    <div class="inline-flex items-center gap-3 px-4 py-2 rounded-xl bg-slate-900/80 border border-slate-800 text-slate-300">
                        <span class="w-3 h-3 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></span>
                        <span>正在搜尋台鐵班次並分析列車即時動態...</span>
                    </div>
                `;

                const fromStationName = fromStationInput.value.replace(/台/g, '臺');
                const toStationName = toStationInput.value.replace(/台/g, '臺');

                const fromStation = stations.find(s => s.name === fromStationName);
                const toStation = stations.find(s => s.name === toStationName);

                if (!fromStation || !toStation) {
                    messageDiv.innerHTML = `
                        <div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300">
                            <svg class="w-4 h-4 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                            <span>請輸入正確的車站名稱（例如：臺北、新竹、板橋）。</span>
                        </div>
                    `;
                    return;
                }
                
                if (fromStation.id === toStation.id) {
                    messageDiv.innerHTML = `
                        <div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300">
                            <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span>出發站與目的地不可相同，請選擇不同車站。</span>
                        </div>
                    `;
                    return;
                }

                try {
                    const timetable = await fetchTimetable(fromStation.id, toStation.id, searchDateInput.value);
                    const delays = await fetchDelays();
                    const prices = await fetchPrice(fromStation.id, toStation.id);

                    const filteredTrains = timetable
                        .filter(train => train.OriginStopTime?.DepartureTime >= searchTimeInput.value)
                        .filter(train => {
                            if (showAllTrainsCheckbox.checked) return true;
                            const nonReservedTypes = ['自強(推拉式自強號且無自行車車廂)', '莒光', '區間'];
                            return nonReservedTypes.some(type => train.DailyTrainInfo?.TrainTypeName?.Zh_tw?.includes(type));
                        })
                        .slice(0, 5);

                    if (filteredTrains.length === 0) {
                        messageDiv.innerHTML = `
                            <div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300">
                                <span>此時段無符合列車，請嘗試調整出發時間或開啟「顯示所有車種」。</span>
                            </div>
                        `;
                    } else {
                        messageDiv.innerHTML = `
                            <div class="inline-flex items-center gap-3 px-4 py-2 rounded-xl bg-slate-900/80 border border-slate-800 text-slate-300">
                                <span class="w-3 h-3 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></span>
                                <span>正在分析列車即時位置與路線進度...</span>
                            </div>
                        `;
                        
                        const preloadedRoutes = {};
                        await Promise.all(filteredTrains.map(async (train) => {
                            try {
                                const trainNo = train.DailyTrainInfo.TrainNo;
                                const depTime = train.OriginStopTime?.DepartureTime || '12:00';
                                const arrTime = train.DestinationStopTime?.ArrivalTime || '13:00';
                                const routeStops = await fetchTrainRoute(
                                    trainNo, 
                                    fromStation.id, 
                                    toStation.id, 
                                    depTime, 
                                    arrTime, 
                                    searchDateInput.value
                                );
                                if (routeStops && routeStops.length > 0) {
                                    preloadedRoutes[trainNo] = routeStops;
                                }
                            } catch (e) {
                                console.error(`預載車次 ${train.DailyTrainInfo.TrainNo} 完整路線失敗`, e);
                            }
                        }));
                        
                        messageDiv.innerHTML = '';
                        renderResults(filteredTrains, delays, prices, preloadedRoutes);
                    }

                } catch (error) {
                    console.error('查詢失敗:', error);
                    messageDiv.innerHTML = `
                        <div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300">
                            <span>查詢時發生錯誤: ${error.message}</span>
                        </div>
                    `;
                }
            }

            function renderResults(trains, delays, prices, preloadedRoutes = {}) {
                resultsContainer.innerHTML = '';
                
                const now = new Date();
                const getLocalYYYYMMDD = (d) => {
                    const yyyy = d.getFullYear();
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    return `${yyyy}-${mm}-${dd}`;
                };
                
                const todayStr = getLocalYYYYMMDD(now);
                const searchDateVal = searchDateInput.value || todayStr;
                
                let isDayFuture = false;
                let isDayPast = false;
                if (searchDateVal > todayStr) {
                    isDayFuture = true;
                } else if (searchDateVal < todayStr) {
                    isDayPast = true;
                }

                trains.forEach((train, idx) => {
                    const delayInfo = delays.find(d => d.TrainNo === train.DailyTrainInfo.TrainNo);
                    const delayMinutes = delayInfo ? delayInfo.DelayTime : 0;
                    const trainTypeName = train.DailyTrainInfo?.TrainTypeName?.Zh_tw || '未知車種';
                    const originStationName = train.OriginStopTime?.StationName?.Zh_tw || '未知車站';
                    const destinationStationName = train.DestinationStopTime?.StationName?.Zh_tw || '未知車站';
                    const startingStationName = train.DailyTrainInfo?.StartingStationName?.Zh_tw || '未知車站';
                    const endingStationName = train.DailyTrainInfo?.EndingStationName?.Zh_tw || '未知車站';
                    const trainDirection = train.DailyTrainInfo?.Direction;

                    // 判斷班次狀態 (未來班次、已收班、行駛中)
                    let trainStatusMode = 'running';
                    if (isDayFuture) {
                        trainStatusMode = 'future';
                    } else if (isDayPast) {
                        trainStatusMode = 'past';
                    } else {
                        const currentHours = now.getHours();
                        const currentMins = now.getMinutes();
                        const currentDayMins = currentHours * 60 + currentMins;
                        
                        const parseTimeToMinutes = (timeStr) => {
                            if (!timeStr) return 0;
                            const [h, m] = timeStr.split(':').map(Number);
                            return h * 60 + m;
                        };
                        
                        let depMins = 0;
                        let arrMins = 0;
                        const stopsList = preloadedRoutes && preloadedRoutes[train.DailyTrainInfo.TrainNo];
                        
                        if (stopsList && stopsList.length > 0) {
                            const firstStop = stopsList[0];
                            const lastStop = stopsList[stopsList.length - 1];
                            const rawDepStr = firstStop.DepartureTime || firstStop.ArrivalTime;
                            const rawArrStr = lastStop.ArrivalTime || lastStop.DepartureTime;
                            depMins = parseTimeToMinutes(rawDepStr) + delayMinutes;
                            arrMins = parseTimeToMinutes(rawArrStr) + delayMinutes;
                        } else {
                            depMins = parseTimeToMinutes(train.OriginStopTime?.DepartureTime) + delayMinutes;
                            arrMins = parseTimeToMinutes(train.DestinationStopTime?.ArrivalTime) + delayMinutes;
                        }
                        
                        if (arrMins < depMins) {
                            arrMins += 24 * 60;
                        }
                        
                        let adjustedCurrentMins = currentDayMins;
                        if (arrMins >= 24 * 60 && currentDayMins < 360) {
                            adjustedCurrentMins += 24 * 60;
                        }
                        
                        if (adjustedCurrentMins < depMins) {
                            trainStatusMode = 'future';
                        } else if (adjustedCurrentMins > arrMins) {
                            trainStatusMode = 'past';
                        } else {
                            trainStatusMode = 'running';
                        }
                    }

                    const priceInfo = prices.find(p => p.FareClasses && p.FareClasses.some(className => trainTypeName.includes(className)) && p.Direction === trainDirection);
                    const fareText = priceInfo ? `$${priceInfo.Price}` : '無票價資訊';
                    const easycardPrice = priceInfo ? `$${priceInfo.EasyCard}` : '無票價資訊';
                    
                    const card = document.createElement('div');
                    card.className = 'group relative bg-slate-900/80 backdrop-blur-xl border border-white/[0.08] hover:border-cyan-500/40 rounded-2xl shadow-xl shadow-black/40 hover:shadow-cyan-500/5 transition-all duration-300 overflow-hidden cursor-pointer';
                    
                    // 現代化軟膠囊 (Soft Pill) 標籤狀態按鈕
                    let statusHtml = '';
                    if (trainStatusMode === 'future') {
                        statusHtml = `
                            <button class="status-btn px-3 py-1.5 bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/30 text-blue-300 rounded-full shadow-xs cursor-pointer inline-flex items-center gap-1.5 transition-all text-xs font-medium" 
                                    data-train="${train.DailyTrainInfo.TrainNo}" 
                                    data-type="${trainTypeName}"

                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                                </span>

                                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                                </svg>

                        statusHtml = `
                            <span class="px-3 py-1.5 bg-slate-800/80 text-slate-400 border border-slate-700/60 rounded-full inline-flex items-center gap-1.5 cursor-not-allowed select-none text-xs font-medium">
                                <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                                <span>已收班</span>
                            </span>
                        `;
                    } else {
                        statusHtml = `
                            <button class="status-btn px-3 py-1.5 rounded-full shadow-xs cursor-pointer inline-flex items-center gap-1.5 transition-all text-xs font-medium ${delayMinutes > 0 ? 'bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}" 
                                    data-train="${train.DailyTrainInfo.TrainNo}" 
                                    data-type="${trainTypeName}" 
                                    data-delay="${delayMinutes}" 
                                    data-from="${train.OriginStopTime?.StationID || ''}" 
                                    data-to="${train.DestinationStopTime?.StationID || ''}"

                                <span class="relative flex h-2 w-2">

                                    <span class="relative inline-flex rounded-full h-2 w-2 ${delayMinutes > 0 ? 'bg-rose-500' : 'bg-emerald-500'}"></span>
                                </span>
                                <span>${delayMinutes > 0 ? `晚 ${delayMinutes} 分` : '準點運行'}</span>
                                <svg class="w-3.5 h-3.5 ${delayMinutes > 0 ? 'text-rose-400' : 'text-emerald-400'} ml-0.5" viewBox="0 0 20 20" fill="currentColor">

                    const trainBadgeBg = getTrainBadgeStyle(trainTypeName);

                    card.innerHTML = `

                        <div class="p-4 md:p-6 card-main-content relative">

                            <div class="grid grid-cols-12 gap-3 items-center">
                                
                                <!-- Column 1: Train Type & Train No -->

            // --- 列車動態路線圖處理 ---
            async function loadAndRenderRoute(card, timeline, trainNo, trainType, delay, fromId, toId, depTime, arrTime) {
                try {
                    const searchDate = searchDateInput.value;
                    const stopTimes = await fetchTrainRoute(trainNo, fromId, toId, depTime, arrTime, searchDate);
                    
                    if (!stopTimes || stopTimes.length === 0) {
                        timeline.innerHTML = '<div class="text-center py-6 text-xs text-rose-400">無法載入此車次之路線圖。</div>';
                        return;
                    }
                    
                    renderRouteTimeline(timeline, stopTimes, delay, fromId, toId, searchDate);
                } catch (err) {
                    console.error("載入路線圖發生錯誤:", err);
                    timeline.innerHTML = `<div class="text-center py-6 text-xs text-rose-400">載入發生錯誤: ${err.message}</div>`;
                }
            }

            async function fetchTrainRoute(trainNo, fromId, toId, depTime, arrTime, searchDate) {
                const formattedDate = searchDate ? searchDate : new Date().toISOString().split('T')[0];
                const cacheKey = `${trainNo}_${formattedDate}`;
                if (globalRouteCache[cacheKey]) {
                    console.log(`[Cache Hit] 使用快取的車次路線：${cacheKey}`);
                    return globalRouteCache[cacheKey];
                }
                
                if (!isKeyProvided()) {
                    const mockRoute = generateMockRoute(trainNo, fromId, toId, depTime, arrTime, searchDate);
                    globalRouteCache[cacheKey] = mockRoute;
                    return mockRoute;
                }
                
                const todayStr = new Date().toISOString().split('T')[0];
                const isSearchingToday = (formattedDate === todayStr);

                try {
                    const token = await getTdxAccessToken();
                    const attempts = [];

                    if (isSearchingToday) {
                        attempts.push({
                            name: "V2_Today_TrainNo",
                            url: `https://tdx.transportdata.tw/api/basic/v2/Rail/TRA/DailyTimetable/Today/TrainNo/${trainNo}?$format=JSON`,
                            parse: (data) => {
                                if (Array.isArray(data) && data.length > 0 && data[0].StopTimes) return data[0].StopTimes;
                                if (data && data.DailyTimetables && data.DailyTimetables.length > 0 && data.DailyTimetables[0].StopTimes) return data.DailyTimetables[0].StopTimes;
                                return null;
                            }
                        });
                    }

                    attempts.push({
                        name: "V2_TrainNo_Date_Direct",
                        url: `https://tdx.transportdata.tw/api/basic/v2/Rail/TRA/DailyTimetable/TrainNo/${trainNo}/${formattedDate}?$format=JSON`,
                        parse: (data) => {
                            if (Array.isArray(data) && data.length > 0 && data[0].StopTimes) return data[0].StopTimes;
                            return null;
                        }
                    });

                    attempts.push({
                        name: "V2_TrainNo_RideDate",
                        url: `https://tdx.transportdata.tw/api/basic/v2/Rail/TRA/DailyTimetable/TrainNo/${trainNo}/RideDate/${formattedDate}?$format=JSON`,
                        parse: (data) => {
                            if (Array.isArray(data) && data.length > 0 && data[0].StopTimes) return data[0].StopTimes;
                            return null;
                        }
                    });

                    attempts.push({
                        name: "V2_TrainNo_TrainDate",
                        url: `https://tdx.transportdata.tw/api/basic/v2/Rail/TRA/DailyTimetable/TrainNo/${trainNo}/TrainDate/${formattedDate}?$format=JSON`,
                        parse: (data) => {
                            if (Array.isArray(data) && data.length > 0 && data[0].StopTimes) return data[0].StopTimes;
                            return null;
                        }
                    });

                    if (isSearchingToday) {
                        attempts.push({
                            name: "V3_Today_TrainNo",
                            url: `https://tdx.transportdata.tw/api/basic/v3/Rail/TRA/DailyTimetable/Today/TrainNo/${trainNo}?$format=JSON`,
                            parse: (data) => {
                                if (data && data.DailyTimetables && data.DailyTimetables.length > 0 && data.DailyTimetables[0].StopTimes) {
                                    return data.DailyTimetables[0].StopTimes;
                                }
                                if (Array.isArray(data) && data.length > 0 && data[0].StopTimes) {
                                    return data[0].StopTimes;
                                }
                                return null;
                            }
                        });
                    }

                    attempts.push({
                        name: "V3_TrainNo_Filtered_OData",
                        url: `https://tdx.transportdata.tw/api/basic/v3/Rail/TRA/DailyTimetable/TrainNo/${trainNo}?$filter=TrainDate eq '${formattedDate}'&$format=JSON`,
                        parse: (data) => {
                            if (data && data.DailyTimetables && data.DailyTimetables.length > 0) {
                                return data.DailyTimetables[0].StopTimes;
                            }
                            if (Array.isArray(data) && data.length > 0 && data[0].StopTimes) {
                                return data[0].StopTimes;
                            }
                            return null;
                        }
                    });

                    attempts.push({
                        name: "V3_TrainNo_Total_Client_Filter",
                        url: `https://tdx.transportdata.tw/api/basic/v3/Rail/TRA/DailyTimetable/TrainNo/${trainNo}?$format=JSON`,
                        parse: (data) => {
                            let timetables = [];
                            if (data && data.DailyTimetables) {
                                timetables = data.DailyTimetables;
                            } else if (Array.isArray(data)) {
                                timetables = data;
                            }
                            const match = timetables.find(t => {
                                const tDate = t.TrainDate || (t.DailyTrainInfo && t.DailyTrainInfo.TrainDate);
                                return tDate === formattedDate;
                            });
                            if (match && match.StopTimes) return match.StopTimes;
                            if (timetables.length > 0 && timetables[0].StopTimes) return timetables[0].StopTimes;
                            return null;
                        }
                    });

                    for (const attempt of attempts) {
                        try {
                            const response = await fetch(attempt.url, {
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            
                            if (response.ok) {
                                const data = await response.json();
                                const stopTimes = attempt.parse(data);
                                if (stopTimes && stopTimes.length > 0) {
                                    console.log(`[TDX 路線圖連線] 成功！使用來源: ${attempt.name}，站點數: ${stopTimes.length}`);
                                    globalRouteCache[cacheKey] = stopTimes;
                                    return stopTimes;
                                }
                            }
                        } catch (attemptErr) {
                            console.warn(`[TDX 路線圖連線] ${attempt.name} 發生異常:`, attemptErr);
                        }
                    }

                    console.warn("所有 TDX 路線圖 API 鏈皆失敗或無符合當日資料，將啟用高擬真模擬資料。");
                    const mockRoute = generateMockRoute(trainNo, fromId, toId, depTime, arrTime, searchDate);
                    globalRouteCache[cacheKey] = mockRoute;
                    return mockRoute;

                } catch (error) {
                    console.error("路線圖主流程錯誤:", error);
                    const mockRoute = generateMockRoute(trainNo, fromId, toId, depTime, arrTime, searchDate);
                    globalRouteCache[cacheKey] = mockRoute;
                    return mockRoute;
                }
            }

            function generateMockRoute(trainNo, fromId, toId, depTime, arrTime, searchDate) {
                const fromIndex = stations.findIndex(s => s.id === fromId);
                const toIndex = stations.findIndex(s => s.id === toId);
                
                if (fromIndex === -1 || toIndex === -1) {
                    return mockGetStaticRoute();
                }
                
                const step = fromIndex < toIndex ? 1 : -1;
                const routeIntermediateStations = [];
                
                routeIntermediateStations.push(stations[fromIndex]);
                
                let curr = fromIndex + step;
                while (curr !== toIndex) {
                    routeIntermediateStations.push(stations[curr]);
                    curr += step;
                }
                
                routeIntermediateStations.push(stations[toIndex]);
                
                const prefixIdx = fromIndex - step;
                if (prefixIdx >= 0 && prefixIdx < stations.length) {
                    routeIntermediateStations.unshift(stations[prefixIdx]);
                }
                
                const suffixIdx = toIndex + step;
                if (suffixIdx >= 0 && suffixIdx < stations.length) {
                    routeIntermediateStations.push(stations[suffixIdx]);
                }
                
                const originIdxInList = routeIntermediateStations.findIndex(s => s.id === fromId);
                const destIdxInList = routeIntermediateStations.findIndex(s => s.id === toId);
                
                const parseTimeToMinutes = (timeStr) => {
                    if (!timeStr) return 720;
                    const [h, m] = timeStr.split(':').map(Number);
                    return h * 60 + m;
                };
                
                const formatMinutesToTime = (totalMins) => {
                    const m = Math.round(totalMins) % (24 * 60);
                    const hours = Math.floor(m / 60);
                    const mins = m % 60;
                    return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
                };
                
                const depMins = parseTimeToMinutes(depTime);
                const arrMins = parseTimeToMinutes(arrTime);
                
                let travelTime = arrMins - depMins;
                if (travelTime < 0) travelTime += 24 * 60;
                
                const segmentCount = destIdxInList - originIdxInList;
                const minPerSegment = travelTime / (segmentCount || 1);
                
                const stopTimes = [];
                for (let i = 0; i < routeIntermediateStations.length; i++) {
                    const station = routeIntermediateStations[i];
                    let arrivalTimeMins, departureTimeMins;
                    
                    if (i === originIdxInList) {
                        departureTimeMins = depMins;
                        arrivalTimeMins = depMins - 1;
                    } else if (i === destIdxInList) {
                        arrivalTimeMins = arrMins;
                        departureTimeMins = arrMins + 1;
                    } else if (i < originIdxInList) {
                        const diffNode = originIdxInList - i;
                        arrivalTimeMins = depMins - diffNode * 15 - 1;
                        departureTimeMins = depMins - diffNode * 15;
                    } else if (i > destIdxInList) {
                        const diffNode = i - destIdxInList;
                        arrivalTimeMins = arrMins + diffNode * 15;
                        departureTimeMins = arrMins + diffNode * 15 + 1;
                    } else {
                        const diffNode = i - originIdxInList;
                        const arrivalEstimate = depMins + diffNode * minPerSegment - 1;
                        arrivalTimeMins = arrivalEstimate;
                        departureTimeMins = arrivalEstimate + 1;
                    }
                    
                    stopTimes.push({
                        StopSequence: i + 1,
                        StationID: station.id,
                        StationName: { Zh_tw: station.name },
                        ArrivalTime: formatMinutesToTime(arrivalTimeMins),
                        DepartureTime: formatMinutesToTime(departureTimeMins)
                    });
                }
                
                return stopTimes;
            }

            function mockGetStaticRoute() {
                return [
                    { StopSequence: 1, StationID: '1210', StationName: { Zh_tw: '新竹' }, ArrivalTime: '11:48', DepartureTime: '11:50' },
                    { StopSequence: 2, StationID: '1180', StationName: { Zh_tw: '竹北' }, ArrivalTime: '12:03', DepartureTime: '12:05' },
                    { StopSequence: 3, StationID: '1100', StationName: { Zh_tw: '中壢' }, ArrivalTime: '12:24', DepartureTime: '12:25' },
                    { StopSequence: 4, StationID: '1080', StationName: { Zh_tw: '桃園' }, ArrivalTime: '12:39', DepartureTime: '12:40' },
                    { StopSequence: 5, StationID: '1040', StationName: { Zh_tw: '樹林' }, ArrivalTime: '12:51', DepartureTime: '12:52' },
                    { StopSequence: 6, StationID: '1020', StationName: { Zh_tw: '板橋' }, ArrivalTime: '13:00', DepartureTime: '13:01' },
                    { StopSequence: 7, StationID: '1000', StationName: { Zh_tw: '臺北' }, ArrivalTime: '13:15', DepartureTime: '13:17' }
                ];
            }

            // 直式進度條 (Timeline) 現代化改造
            function renderRouteTimeline(timeline, stopTimes, delay, fromId, toId, searchDate) {
                timeline.innerHTML = '';
                
                const parseTimeToMinutes = (timeStr) => {
                    if (!timeStr) return 0;
                    const [h, m] = timeStr.split(':').map(Number);
                    return h * 60 + m;
                };
                
                const formatMinutesToTime = (totalMins) => {
                    const m = Math.round(totalMins) % (24 * 60);
                    const hours = Math.floor(m / 60);
                    const mins = m % 60;
                    return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
                };
                
                const now = new Date();
                const currHours = now.getHours();
                const currMins = now.getMinutes();
                const currentDayMins = currHours * 60 + currMins;
                
                const todayStr = now.toISOString().split('T')[0];
                const isSearchingToday = (searchDate === todayStr);
                
                const stopsWithEst = stopTimes.map(stop => {
                    const scheduledArr = parseTimeToMinutes(stop.ArrivalTime || stop.DepartureTime);
                    const scheduledDep = parseTimeToMinutes(stop.DepartureTime || stop.ArrivalTime);
                    
                    return {
                        ...stop,
                        scheduledArr,
                        scheduledDep,
                        estArr: scheduledArr + delay,
                        estDep: scheduledDep + delay
                    };
                });
                
                let activeStopIndex = -1;
                let activeBetweenIndex = -1;
                let statusLabel = '即時排班推估';
                let isSimulated = false;
                let targetTimeMins = currentDayMins;
                
                if (!isSearchingToday) {
                    const startEst = stopsWithEst[0].estDep;
                    targetTimeMins = startEst + 5;
                    statusLabel = '列車行駛示範';
                    isSimulated = true;
                } else {
                    const firstStopEst = stopsWithEst[0].estArr;
                    const lastStopEst = stopsWithEst[stopsWithEst.length - 1].estArr;
                    
                    if (currentDayMins < firstStopEst) {
                        statusLabel = '尚未開車';
                        activeStopIndex = 0;
                    } else if (currentDayMins > lastStopEst) {
                        statusLabel = '已抵達終點站';
                        activeStopIndex = stopsWithEst.length - 1;
                    }
                }
                
                if (activeStopIndex === -1 && activeBetweenIndex === -1) {
                    for (let i = 0; i < stopsWithEst.length; i++) {
                        const stop = stopsWithEst[i];
                        if (targetTimeMins >= stop.estArr && targetTimeMins <= stop.estDep) {
                            activeStopIndex = i;
                            break;
                        }
                        if (i < stopsWithEst.length - 1) {
                            const nextStop = stopsWithEst[i+1];
                            if (targetTimeMins > stop.estDep && targetTimeMins < nextStop.estArr) {
                                activeBetweenIndex = i;
                                break;
                            }
                        }
                    }
                }
                
                if (activeStopIndex === -1 && activeBetweenIndex === -1) {
                    const firstStopEst = stopsWithEst[0].estDep;
                    targetTimeMins = firstStopEst + 5;
                    statusLabel = '動態位置模擬';
                    isSimulated = true;
                    
                    for (let i = 0; i < stopsWithEst.length; i++) {
                        const stop = stopsWithEst[i];
                        if (targetTimeMins >= stop.estArr && targetTimeMins <= stop.estDep) {
                            activeStopIndex = i;
                            break;
                        }
                        if (i < stopsWithEst.length - 1) {
                            const nextStop = stopsWithEst[i+1];
                            if (targetTimeMins > stop.estDep && targetTimeMins < nextStop.estArr) {
                                activeBetweenIndex = i;
                                break;
                            }
                        }
                    }
                }
                
                // Timeline Top Status Ribbon
                const headerDiv = document.createElement('div');
                headerDiv.className = 'mb-4 flex items-center justify-between text-xs bg-slate-800/80 border border-slate-700/80 rounded-xl p-2.5 shadow-sm';
                headerDiv.innerHTML = `
                    <div class="flex items-center gap-2 font-medium text-slate-200">
                        <span class="w-2 h-2 rounded-full ${isSimulated ? 'bg-amber-400' : 'bg-rose-400 animate-ping'}"></span>
                        <span>動態狀態：<span class="${isSimulated ? 'text-amber-400' : 'text-rose-400 font-bold'}">${statusLabel}</span></span>
                    </div>
                    <div class="text-slate-400 text-[11px] font-mono">
                        誤點時間：<span class="font-bold ${delay > 0 ? 'text-rose-400' : 'text-emerald-400'}">${delay > 0 ? `+${delay} 分鐘` : '準點 (0分)'}</span>
                    </div>
                `;
                timeline.appendChild(headerDiv);
                
                let scrollTarget = null;
                
                stopsWithEst.forEach((stop, i) => {

                if (typeName.includes('區間')) return 'text-emerald-400';
                return 'text-slate-200';

                }
                if (typeName.includes('自強')) {
                    return 'bg-amber-500/15 text-amber-300 border-amber-500/30';
                }
                if (typeName.includes('莒光')) {
                    return 'bg-sky-500/15 text-sky-300 border-sky-500/30';
                }
                if (typeName.includes('區間')) {
                    return 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
                }
                return 'bg-slate-800 text-slate-300 border-slate-700';
            }

            function calculateDuration(start, end) {
                if (!start || !end) return '無資料';
                const [startH, startM] = start.split(':').map(Number);
                const [endH, endM] = end.split(':').map(Number);
                let diff = (endH * 60 + endM) - (startH * 60 + startM);
                if (diff < 0) diff += 24 * 60;
                const h = Math.floor(diff / 60);
                const m = diff % 60;
                return `${h > 0 ? h + ' 小時 ' : ''}${m} 分`;
            }

            // --- 真實 API 串接 ---
            const TDX_CLIENT_ID = 'jacky841026-3f8ab20a-1893-42cc';
            const TDX_CLIENT_SECRET = 'd44c0656-19f7-4ae5-86a5-f8feba4ecf71';
            let tdxAccessToken = null;

            function isKeyProvided() {
                return TDX_CLIENT_ID !== '' && TDX_CLIENT_SECRET !== '' && TDX_CLIENT_ID !== 'XXXX';
            }

            async function getTdxAccessToken() {
                if (tdxAccessToken) return tdxAccessToken;

                const authUrl = 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
                const params = new URLSearchParams();
                params.append('grant_type', 'client_credentials');
                params.append('client_id', TDX_CLIENT_ID);
                params.append('client_secret', TDX_CLIENT_SECRET);

                const response = await fetch(authUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    if (response.status === 429) {
                        throw new Error(`API 請求頻率超過限制。請稍後再試。`);
                    }
                    throw new Error(`無法取得 TDX Access Token，請檢查您的 ID 和 Secret。錯誤訊息: ${errorData.message}`);
                }
                
                const data = await response.json();
                tdxAccessToken = data.access_token;
                return tdxAccessToken;
            }

            async function fetchTimetable(fromStationId, toStationId, date) {
                if (!isKeyProvided()) {
                    console.warn("未提供 TDX API Key，啟用離線高擬真模擬資料。");
                    return mockFetchTimetable(fromStationId, toStationId, date);
                }

                try {
                    const token = await getTdxAccessToken();
                    const apiUrl = `https://tdx.transportdata.tw/api/basic/v2/Rail/TRA/DailyTimetable/OD/${fromStationId}/to/${toStationId}/${date}?$format=JSON`;
                    
                    const response = await fetch(apiUrl, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`無法從 TDX API 獲取班次資料。錯誤代碼: ${response.status}。詳細錯誤: ${errorData.message || '未知'}`);
                    }
                    return await response.json();
                } catch (error) {
                    console.error('查詢班次資料失敗:', error);
                    throw error;
                }
            }

            async function fetchDelays() {

                const trainTypeMap = {

                    '2': ['普悠瑪(普悠瑪)', '普悠瑪'],

                        '普快(專開列車)'
                    ],
                    '10': ['區間快'],
                    '11': ['自強(3000)(EMU3000 型電車)']
                };

                try {
                    const token = await getTdxAccessToken();
                    const apiUrl = `https://tdx.transportdata.tw/api/basic/v3/Rail/TRA/ODFare/${fromStationId}/to/${toStationId}?$format=JSON`;
                    
                    const response = await fetch(apiUrl, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        if (response.status === 429) {
                            throw new Error(`API 請求頻率超過限制。請稍後再試。`);
                        }
                        console.error("無法獲取票價資訊，請檢查 API Key。", errorData);
                        return []; 
                    }
                    const fareData = await response.json();
                    
                    if (!fareData || !Array.isArray(fareData.ODFares)) {
                        console.error("TDX API 票價資料回傳格式非陣列", fareData);
                        return [];
                    }
                    
                    return fareData.ODFares.map(item => {
                        const fareClassNames = trainTypeMap[item.TrainType] || ['未知車種'];
                        const price = (item.Fares && item.Fares.length > 0) ? item.Fares[0].Price : null;
                        const direction = item.Direction;
                        const distance = item.TravelDistance;

                        const priceInterval = [50, 100, 200, 300, 99999];
                        const priceIntervalDiff = [50, 50, 100, 100, 99999];
                        const priceByType = {'1': '電子票券不適用', '2': '電子票券不適用', '3': [2.18, 2.98, 2.81, 2.37, 2.20], '4': [2.18, 1.92, 1.81, 1.53, 1.42], '5': '電子票券不適用', '6': [2.18, 1.92, 1.81, 1.53, 1.42], '7': '電子票券不適用', '10': [2.18, 1.92, 1.81, 1.53, 1.42], '11': '電子票券不適用'};
                        let easycardPrice = 0;
                        const priceType = priceByType[item.TrainType];
                        if (priceType === '電子票券不適用') {
                            easycardPrice = 0;
                        } else {
                            easycardPrice = (distance <= priceInterval[0]) ? Math.max(distance * priceType[0], priceType[0]*10) : 0;

                            for (let i = 1; i < priceInterval.length && easycardPrice === 0; i++) {
                                if (priceInterval[i] > distance) {
                                    easycardPrice += (distance - priceInterval[i-1]) * priceByType[item.TrainType][i];
                                    for (let j = 0; j < priceByType[item.TrainType].slice(0, i).length; j++) {
                                        easycardPrice += priceByType[item.TrainType][j] * priceIntervalDiff[j];
                                    }
                                }
                            }
                        }

                        return {
                            FareClasses: fareClassNames,
                            Price: price,
                            Direction: direction,
                            Distance: distance,
                            EasyCard: Math.round(easycardPrice)
                        };
                    });
                } catch (error) {
                    console.error('獲取票價資訊失敗:', error);
                    return [];
                }
            }
